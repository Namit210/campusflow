$kind: http-request
name: Health
method: GET
url: '{{base_url}}/health'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('health is ok', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().status).to.eql('ok');
      });
