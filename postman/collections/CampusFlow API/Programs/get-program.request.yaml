$kind: http-request
name: Get program
method: GET
url: '{{base_url}}/programs/:id'
order: 2000
pathVariables:
  - key: id
    value: '{{programId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns one program', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().id).to.eql(pm.environment.get('programId'));
      });
