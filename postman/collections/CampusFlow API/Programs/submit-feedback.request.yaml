$kind: http-request
name: Submit feedback
method: POST
url: '{{base_url}}/programs/:id/feedback'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
pathVariables:
  - key: id
    value: '{{programId}}'
body:
  type: json
  content: |-
    {
      "rating": 5,
      "category": "Content",
      "email": "alex@test.com",
      "comment": "Clear, practical, and well paced."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('stores feedback', function () {
        pm.response.to.have.status(201);
        pm.expect(pm.response.json().message).to.include('feedback');
      });
