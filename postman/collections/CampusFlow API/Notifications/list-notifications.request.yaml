$kind: http-request
name: List notifications
method: GET
url: '{{base_url}}/notifications'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns notifications for the user', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.notifications).to.be.an('array').and.not.empty;
        pm.expect(body.unreadCount).to.be.a('number');
        pm.environment.set('notificationId', body.notifications[0].id);
      });
